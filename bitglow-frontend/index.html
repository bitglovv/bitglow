<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <title>BitGlow</title>
    <link rel="icon" type="image/png" href="/bitglow.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Meta -->
    <meta name="description"
        content="BitGlow is a real-time global chat experience built for presence and connection." />

    <!-- theme-color: controls Android status bar + PWA splash tint -->
    <meta name="theme-color" content="#09090B" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BitGlow">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inline critical styles: prevent any white flash before CSS loads -->
    <style>
        html,
        body,
        #root {
            margin: 0;
            padding: 0;
            background: #09090B;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- React mounts here -->
    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
